name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Code Style Check
        run: ./gradlew ktlintCheck --console=plain

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Verify Release Packaging
        run: ./gradlew verifyReleasePackaging --console=plain
